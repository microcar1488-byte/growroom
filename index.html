<title>Гроурум</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#141017; --surface:#1d1722; --surface2:#271f2d; --line:#382d40;
  --text:#f2ebf4; --muted:#ab9ab2; --dim:#76677e;
  --amber:#f0a23b; --amber-ink:#221505; --leaf:#8cc152; --water:#62b3e6;
  --warn:#e8c547; --bad:#ef5b5b; --glow:#c86bd6;
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-inline:-16px;padding:8px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.02em}
.brand span{color:var(--amber)}
.clock{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.bulb{width:10px;height:10px;border-radius:50%;background:#3a3350;box-shadow:none}
.bulb.on{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.hud-row{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;white-space:nowrap}
.money{font-family:var(--f-mono);font-weight:600;color:var(--amber)}
.lvl{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.lvl b{font-family:var(--f-display);font-size:12px;font-weight:700}
.xpbar{flex:1;height:6px;border-radius:6px;background:var(--surface2);overflow:hidden;min-width:40px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--glow),var(--amber));border-radius:6px}
.sp{background:var(--glow);color:#1a0d1d;font-weight:700;border-color:transparent}

/* Sections */
h2{font-family:var(--f-display);font-weight:700;font-size:18px;margin:22px 0 10px;letter-spacing:.01em;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:11.5px}

/* Slots */
.slots{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.slots::-webkit-scrollbar{display:none}
.slot{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 12px;text-align:left;position:relative;min-width:108px}
.slot.sel{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,var(--surface))}
.slot .n{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.slot .s{font-size:13.5px;font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.slot.empty .s{color:var(--muted);font-weight:500}

/* Scene */
.scene{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);margin-top:10px;background:#0f0c12}
.scene canvas{display:block;width:100%;height:330px}
.ov{position:absolute;display:flex;gap:6px;flex-wrap:wrap}
.ov.otl{top:10px;left:10px}.ov.otr{top:10px;right:10px}.ov.obl{bottom:24px;left:10px;right:10px;justify-content:space-between}
.pill{background:rgba(15,11,18,.72);border:1px solid rgba(255,255,255,.08);color:var(--text);border-radius:999px;padding:3px 10px;font-size:12px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}

.nb{display:grid;gap:4px;font-size:12px}
.nb .top{display:flex;justify-content:space-between}
.nb .top b{font-family:var(--f-mono)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface2);border-radius:12px;padding:10px}
.stat .k{font-size:11.5px;color:var(--muted)}
.stat .v{font-family:var(--f-mono);font-size:17px;font-weight:600;margin-top:2px}
.trich{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:6px}

  for(const k in d.tog) if(s.tog[k]===undefined) s.tog[k]=d.tog[k];

function fp(p){return p.stage==='flower'?p.flowerH/(strainOf(p.strain).flower*24):0;}
function lightsOn(h){const hr=((h%24)+24)%24;return ((hr-6+24)%24)<S.sched;}
function sizeF(p){if(p.stage==='germ')return .1;if(p.stage==='seed')return .3;return .4+Math.min(p.height/90,1.4);}

function stageTarget(p){
  if(!p||p.stage==='germ'||p.stage==='seed')return {t:[22,27],rh:[60,75],name:'росток'};
  if(p.stage==='veg')return {t:[22,28],rh:[45,65],name:'вегетация'};

function leadPlant(){ // самый «взрослый» куст задаёт климат
  let best=null,score=-1;
  for(const p of livePlants()){const s=p.stage==='flower'?2+fp(p):p.stage==='veg'?1:0;if(s>score){score=s;best=p;}}
  return best;
}
function envNow(h){
  const L=light(),on=lightsOn(h);
  const heat=L.heat*(sk('e3')?.6:1);
  const fanOn=S.eq.fan&&S.tog.fan, acOn=S.eq.ac&&S.tog.ac;
  let t=22+(on?heat:-2.5)-(fanOn?2.5:0)-(acOn?5:0);
  let transp=0;for(const p of livePlants())transp+=sizeF(p)*2.2;transp=Math.min(transp,16);
  let rh=50+(on?0:7)+transp+(S.eq.humid&&S.tog.humid?14:0)-(S.eq.dehumid&&S.tog.dehumid?16:0)-(fanOn?6:0)-(t-24)*.9;
  return {on,t:clamp(t,12,40),rh:clamp(rh,18,95)};
}
function lightDose(p,n){
  const L=light(),st=strainOf(p.strain);
  let d=L.par*Math.min(1,L.cover/Math.max(1,n));
  const flowering=p.stage==='flower';
  if(!flowering||st.auto) d*=Math.min(S.sched,20)/18;
  if(L.spec==='amber') d*=flowering?1.05:.93;
  return d;
}
function phUptake(p){const [lo,hi]=MEDIA[p.medium].ideal;const d=p.ph<lo?lo-p.ph:p.ph>hi?p.ph-hi:0;return clamp(1-d*.9,.2,1);}
function burnThr(){return 88+(sk('c1')?8:0);}

/* ================= SIMULATION ================= */
function simulate(hours){
  let rem=hours;
  while(rem>1e-9){
    const dt=Math.min(.5,rem);rem-=dt;
    const prev=S.gameH;S.gameH+=dt;
    if(Math.floor(prev/24)!==Math.floor(S.gameH/24))newDay();
    if(S.eq.climate)autoClimate();
    const env=envNow(S.gameH);
    const n=livePlants().length;
    for(const p of S.slots) if(p&&p.alive) stepPlant(p,dt,env,n);
    pollenCheck();
    for(const j of S.jars) stepJar(j,dt);
  }
}
function autoClimate(){
  const p=leadPlant();if(!p)return;
  const tg=stageTarget(p);
  const save={...S.tog};
  S.tog.humid=false;S.tog.dehumid=false;S.tog.ac=false;
  const e=envNow(S.gameH);
  if(S.eq.ac&&e.t>tg.t[1])S.tog.ac=true;
  const e2=envNow(S.gameH);
  if(S.eq.dehumid&&e2.rh>tg.rh[1]-2)S.tog.dehumid=true;
  else if(S.eq.humid&&e2.rh<tg.rh[0]+2)S.tog.humid=true;
  if(save.humid!==S.tog.humid||save.dehumid!==S.tog.dehumid||save.ac!==S.tog.ac)dirtyUI=true;
}
function stepPlant(p,dt,env,n){
  const st=strainOf(p.strain),M=MEDIA[p.medium],pot=POTS[p.pot]||POTS.p7;
  p.ageH+=dt;p.stageH+=dt;p.sinceFeed+=dt;
  if(p.recoverH>0)p.recoverH-=dt;
  if(p.rootsH>0)p.rootsH-=dt;
  const sz=sizeF(p);
  // вода
  const use=1.25*sz*(env.on?1:.35)*(1+Math.max(-.5,(env.t-24)*.05))*M.water*pot.water*(sk('a2')?.85:1)*dt;
  p.moist=Math.max(0,p.moist-use);
  if(S.eq.drip&&p.moist<32)autoWater(p);
  let waterF=p.moist<10?.1:p.moist<30?.1+(p.moist-10)/20*.9:p.moist>88&&p.medium!=='hydro'?.9:1;
  if(p.moist>85&&p.medium!=='hydro')p.wetH+=dt;else p.wetH=Math.max(0,p.wetH-dt*.6);
  // pH
  p.ph=clamp(p.ph+M.drift*dt,4,8.5);
  const phUp=phUptake(p);p.phUp=phUp;
  // питание
  const f=fp(p);
  let dem;
  if(p.stage==='germ')dem={n:0,p:0,k:0,cm:0};
  else if(p.stage==='seed')dem={n:.04,p:.03,k:.03,cm:.02};
  else if(p.stage==='veg')dem={n:.22,p:.08,k:.15,cm:.07};
  else if(f<.3)dem={n:.12,p:.18,k:.2,cm:.08};
  else dem={n:.05,p:.24,k:.28,cm:.07};
  if(p.sex==='M'&&p.stage==='flower')dem={n:.08,p:.08,k:.1,cm:.05};
  const sc=sz*dt*(.5+.5*light().par);
  let nf=1;const defs=[];
  for(const k of ['n','p','k','cm']){
    p.nut[k]=Math.max(0,p.nut[k]-dem[k]*sc*(.4+.6*phUp)*(k==='cm'&&p.medium==='soil'?.2:1));
    if(p.stage==='germ')continue;
    if(k==='n'&&p.stage==='flower'&&f>.75)continue; // естественное пожелтение перед сбором
    if(p.nut[k]<12){nf*=.55+p.nut[k]/12*.45;defs.push(k);}
  }
  if(phUp<.75)nf*=Math.min(1,phUp+.25);
  p.def=defs;
  let over=0;for(const k of ['n','p','k'])over=Math.max(over,p.nut[k]-burnThr());
  p.burn=over>0;
  // климат
  const tg=stageTarget(p);
  const tDev=env.t<tg.t[0]?tg.t[0]-env.t:env.t>tg.t[1]?env.t-tg.t[1]:0;
  const rDev=env.rh<tg.rh[0]?tg.rh[0]-env.rh:env.rh>tg.rh[1]?env.rh-tg.rh[1]:0;
  const envF=clamp(1-tDev*.06-rDev*.012,.3,1);
  // вредители
  stepPests(p,env,dt,st);
  // здоровье
  let dmg=0;
  if(p.stage!=='germ'){
    if(p.moist<12)dmg+=.45*(sk('a2')?.7:1);
    if(p.wetH>36)dmg+=.06;
    dmg+=defs.length*.05;
    if(over>0)dmg+=.03*over;
    if(env.t>31)dmg+=.12*(env.t-31);
    if(env.t<15)dmg+=.05*(15-env.t);
    dmg+=p.pest.mites*.004+p.pest.mildew*.003+p.pest.gnats*.002+p.pest.rot*.002;
    if(phUp<.6)dmg+=.04;
  }
  if(dmg>0){p.health-=dmg*dt;p.stress+=Math.min(1,dmg*.8)*dt;}
  else{p.health+=.25*dt;p.stress-=.35*dt;}
  if(dmg<.05)p.stress-=.15*dt;
  p.health=clamp(p.health,0,100);p.stress=clamp(p.stress,0,100);
  const pm=Math.max(p.pest.mites,p.pest.gnats,p.pest.mildew,p.pest.rot);if(pm>p.pestMax)p.pestMax=pm;
  if(p.health<=0){p.alive=false;p.stage='dead';log(`${st.name} погиб(ла). Проверь полив, питание и климат.`,'bad');dirtyUI=true;return;}
  // рост
  let g=lightDose(p,n)*waterF*nf*envF*(.35+.65*p.health/100)*(1-p.stress/250)*M.grow*(1+.05*sk('a1'))*(p.rootsH>0?1.15:1)*(p.recoverH>0?.35:1);
  g*=1-(p.pest.mites/200)-(p.pest.gnats/400);
  g=Math.max(0,g);
  switch(p.stage){
    case 'germ':
      if(p.moist>25)p.germH+=dt;
      if(p.germH>=72){p.stage='seed';p.stageH=0;p.height=1.5;log(`${st.name}: семечко проклюнулось.`,'good');dirtyUI=true;}
      break;
    case 'seed':
      p.height+=.035*g*dt;
      if(p.stageH>=(st.auto?12:14)*24){
        p.stage='veg';p.stageH=0;dirtyUI=true;
        if(!p.sexKnown&&sk('b1')){p.sexKnown=true;log(`${st.name}: по признакам это ${p.sex==='M'?'мужское':'женское'} растение.`,p.sex==='M'?'warn':'good');}
        log(`${st.name}: росток окреп — началась вегетация.`,'good');
      }
      break;
    case 'veg':
      p.height+=st.grow/24*g*dt*(p.lst?.78:1)*(p.topped?.9:1);
      if(!p.sexKnown&&p.stageH>=21*24){p.sexKnown=true;dirtyUI=true;log(`${st.name}: появились предцветки — это ${p.sex==='M'?'САМЕЦ. Убери его или собери пыльцу, иначе он опылит самок.':'самка.'}`,p.sex==='M'?'bad':'good');}
      if(st.auto?p.stageH>=st.veg*24:S.sched<=12)startFlower(p);
      break;
    case 'flower':{
      const adv=st.auto||S.sched<=12?1:0;
      if(!adv)p.stress=clamp(p.stress+.12*dt,0,100);
      p.flowerH+=dt*adv;
      const ff=fp(p);
      if(ff<.35)p.height+=st.grow/24*(st.stretch-1)*1.7*g*dt*adv*(p.scrog?.5:1);
      if(p.sex==='M'){
        if(!p.sexKnown&&p.flowerH>=5*24){p.sexKnown=true;dirtyUI=true;log(`${st.name}: это мужское растение! Скоро пыльца.`,'bad');}
        break;
      }
      const curve=ff<.2?.3:ff<.8?1.4:ff<1?.8:ff<1.35?.35:0;
      p.bud+=1.2*st.yield/(st.flower*24)*curve*g*p.sizeMod*pot.yield*(1+p.train+p.pkB)*(p.pollinated?.55:1)*(1+.1*sk('a4'))*dt*adv;
      if(ff>1.35){p.bud*=1-.0015*dt;p.qPen+=.012*dt;}
      const cond=Math.min(1,(p.health/100)*Math.sqrt(envF)*Math.pow(phUp,.3)*(1-(p.pest.mildew+p.pest.rot)/250));
      p.qAcc+=cond*dt*adv;p.qW+=dt*adv;
      if(p.stress>70&&!p.herm&&!p.pollinated&&rnd()<.0012*dt){p.herm=true;p.pollinated=true;p.father=p.strain;log(`${st.name}: от сильного стресса стал(а) гермафродитом и опылил(а) себя. Будут семена, но качество упадёт.`,'bad');dirtyUI=true;}
      break;}
  }
}
function startFlower(p){
  const st=strainOf(p.strain);
  p.nodesFlip=nodeCount(p);p.stage='flower';p.stageH=0;p.flowerH=0;
  p.sizeMod=st.auto?clamp(.7+p.height/80,.7,1.3):clamp(.45+p.height/70,.55,1.5);
  log(`${st.name}: переход в цветение (высота ${fmt(p.height)} см).`,'good');dirtyUI=true;
}
function stepPests(p,env,dt,st){
  const P=p.pest,fan=S.eq.fan&&S.tog.fan;
  if(p.protH>0)p.protH-=dt;
  const chance=x=>rnd()<Math.max(0,x)*dt;
  const hotDry=env.t>27&&env.rh<45;
  if(P.mites>0)P.mites=clamp(P.mites+(p.protH>0?-1:(hotDry?.8:.35))*dt,0,100);
  else if(p.protH<=0&&p.stage!=='germ'&&chance(.00015+(hotDry?.003:0)-(fan?.0001:0))){P.mites=1;}
  if(P.gnats>0)P.gnats=clamp(P.gnats+(p.wetH>12?.6:-.35)*dt,0,100);
  else if(p.wetH>24&&chance(.008))P.gnats=1;
  if(P.mildew>0)P.mildew=clamp(P.mildew+(env.rh>62?.35:env.rh>55?.05:-.2)*dt*(fan?.7:1),0,100);
  else if(p.stage!=='germ'&&env.rh>65&&chance(.003*(fan?.4:1)*(1.3-st.mold)))P.mildew=1;
  if(p.stage==='flower'&&p.sex!=='M'){
    const f=fp(p);
    if(P.rot>0)P.rot=clamp(P.rot+(env.rh>50?.7:.15)*dt,0,100);
    else if(f>.45&&env.rh>52&&chance(.0025*(1.1-st.mold)*(env.rh-50)/8*(.6+st.ind)))P.rot=1;
  }
  for(const k in P){if(P[k]>0&&P[k]<1&&P[k]!==1)P[k]=0;}
}
function pollenCheck(){
  const males=livePlants().filter(p=>p.sex==='M'&&p.stage==='flower'&&p.flowerH>=13*24);
  if(!males.length)return;
  for(const p of livePlants()){
    if(p.sex==='F'&&p.stage==='flower'&&!p.pollinated&&fp(p)<.75){
      p.pollinated=true;p.father=males[0].strain;
      log(`${strainOf(p.strain).name} опылён(а) пыльцой ${strainOf(males[0].strain).name}. Урожай меньше, зато будут семена.`,'warn');dirtyUI=true;
    }
  }
}
function stepJar(j,dt){

  if(j.phase==='cure'){j.cureH+=dt;j.q=Math.min(100,j.q0+Math.min(12,j.cureH*.024));}
}
function newDay(){
  S.market=clamp(S.market+(rnd()-.5)*.12+(1-S.market)*.05,.75,1.3);
  S.orders=S.orders.filter(o=>o.exp>S.gameH);

function autoWater(p){
  const M=MEDIA[p.medium];
  let ferts=[];
  if(S.eq.feeder){
    const f=fp(p);
    if(!(p.stage==='flower'&&f>.82)&&p.stage!=='germ'){
      if((p.stage==='veg'||p.stage==='seed')&&p.nut.n<45&&(S.items.grow||0)>0)ferts.push('grow');
      if(p.stage==='flower'&&(p.nut.p<45||p.nut.k<45)&&(S.items.bloom||0)>0)ferts.push('bloom');
      if(p.nut.cm<40&&(S.items.calmag||0)>0)ferts.push('calmag');
    }
  }
  doWater(p,ferts,S.autoPh,true);
}

/* ================= ACTIONS ================= */
function doWater(p,ferts,usePh,auto){
  const M=MEDIA[p.medium];const st=strainOf(p.strain);
  if(p.medium==='hydro'){p.nut={n:0,p:0,k:0,cm:0};}
  else{
    if(!auto&&p.moist>72){p.wetH+=14;p.stress=clamp(p.stress+3,0,100);toast('Субстрат был ещё мокрый — корням не хватает воздуха.','bad');}
    for(const k in p.nut)p.nut[k]*=(1-M.leach);
  }
  p.moist=100;
  let wph=7.4;
  if(usePh){
    if(auto&&sk('e2'))wph=M.phTarget;
    else if((S.items.ph||0)>0){S.items.ph--;wph=M.phTarget;}
  }
  p.ph+=(wph-p.ph)*M.phK;
  const mult=sk('c1')?1.2:1;
  let fed=false;
  for(const id of ferts){
    if((S.items[id]||0)<=0)continue;
    S.items[id]--;fed=true;
    const it=ITEMS[id];
    for(const k in it.add)p.nut[k]=Math.min(130,p.nut[k]+it.add[k]*mult);
    if(id==='roots')p.rootsH=5*24;
    if(id==='pk'){const f=fp(p);if(p.stage==='flower'&&f>=.3&&f<=.7&&p.pkUses<2){p.pkUses++;p.pkB+=.08;}}
    if(id==='compost')p.organic=Math.min(5,p.organic+1);
  }
  if(fed)p.sinceFeed=0;
  if(!auto)addXP(fed?3:1);
}
function plantSeed(slot,key,medium){
  const [strain,f]=key.split('|');const M=MEDIA[medium];
  if((S.seeds[key]||0)<=0||S.money<M.price||S.slots[slot])return;
  S.seeds[key]--;if(!S.seeds[key])delete S.seeds[key];
  S.money-=M.price;
  const p=newPlant(strain,f==='f',medium);

  log(`Посажено: ${strainOf(strain).name} (${f==='f'?'фем.':'регуляр'}) в ${M.name.toLowerCase()}.`,'good');

}
function train(p,kind){
  const st=strainOf(p.strain);const m3=sk('a3')?1.3:1,s3=sk('a3')?.5:1;
  if(kind==='lst'){p.lst=true;p.train+=.10*m3;p.stress+=5*s3;log(`${st.name}: LST — ветки отогнуты, крона станет ровнее.`);}
  if(kind==='top'){p.topped++;p.train+=(st.auto?.04:.12)*m3;p.stress+=(st.auto?30:20)*s3;p.recoverH=48;log(`${st.name}: топпинг — верхушка удалена, растут ${p.topped===1?'2':'4'} главные колы.`);}
  if(kind==='scrog'){S.items.net--;p.scrog=true;p.train+=.18*m3;p.stress+=5*s3;log(`${st.name}: ветки заправлены в сетку SCROG.`);}
  if(kind==='defol'){p.defol++;if(p.health<60){p.train-=.04;p.stress+=25*s3;log(`${st.name}: дефолиация на ослабленном кусте — только хуже.`,'warn');}else{p.train+=.06*m3;p.stress+=12*s3;log(`${st.name}: дефолиация — свет проходит к нижним шишкам.`);}}
  p.stress=clamp(p.stress,0,100);addXP(6);
}
function trainOptions(p){
  const st=strainOf(p.strain);const vegD=p.stage==='veg'?p.stageH/24:0;const f=fp(p);
  return [
    {k:'lst',name:'LST — мягкое отгибание',desc:'+10% урожая, куст ниже и шире. Стресс +5.',ok:p.stage==='veg'&&!p.lst,why:p.lst?'Уже сделано':'Только в вегетации'},

function treat(p,id){
  const it=ITEMS[id];if((S.items[id]||0)<=0)return;

  if(id==='predator')p.protH=240;
  if(id==='neem'){p.protH=Math.max(p.protH,48);if(p.stage==='flower'&&fp(p)>.4){p.qPen+=8;toast('Масло нима на шишках — вкус пострадает.','bad');}}
  if(id==='bicarb'&&p.stage==='flower'&&fp(p)>.6)p.qPen+=3;

}
function cutRot(p){p.bud*=.85;p.pest.rot=0;p.qPen+=4;log(`${strainOf(p.strain).name}: вырезаны шишки с гнилью.`,'warn');}
function trichomes(p){
  const f=fp(p);
  const clear=f<.65?1:Math.max(0,1-(f-.65)/.3);
  const amber=f<.92?0:Math.min(.6,(f-.92)*1.2);
  return {clear,milky:Math.max(0,1-clear-amber),amber};
}
function estimate(p){
  const st=strainOf(p.strain),tr=trichomes(p),L=light();
  const avg=p.qW>0?p.qAcc/p.qW:.8;
  const timing=clamp(tr.milky+tr.amber*(tr.amber<.35?.9:.4)+tr.clear*.2,0,1);
  let flush=p.sinceFeed>=7*24?8:p.sinceFeed>=3*24?4:-5;
  if(sk('c2')&&flush>0)flush*=1.5;
  const q=clamp(55*avg+20*timing+flush+(st.value-1)*20+sk('c3')*4+p.organic-p.qPen-(p.pollinated?12:0)-(p.pest.rot*.1),0,100);
  const pot=clamp(.75+.25*tr.milky+.15*tr.amber-.25*tr.clear,.4,1.05);
  const thc=st.thc>1?Math.max(.1,st.thc*(.55+.45*avg)*L.pot*pot+sk('c4')*1.5):st.thc;
  const g=p.bud*(1-p.pest.rot/200);
  const effect=tr.clear>.5?'Слабый, недозрелый':tr.amber>.3?'Расслабляющий, тяжёлый':tr.amber>.12?'Сбалансированный':'Бодрый, ясный';
  return {g,q,thc,cbd:st.cbd,effect,tr,timing};
}
function harvest(slot){
  const p=S.slots[slot];if(!p)return;
  const st=strainOf(p.strain);const e=estimate(p);
  const jar={id:uid(),strain:p.strain,name:st.name,g:Math.max(1,Math.round(e.g*10)/10),q0:Math.round(e.q),q:Math.round(e.q),thc:Math.round(e.thc*10)/10,cbd:e.cbd,effect:e.effect,phase:'dry',t:0,cureH:0};
  S.jars.unshift(jar);
  let seedMsg='';
  if(p.pollinated){
    const child=p.father&&p.father!==p.strain?makeHybrid(p.strain,p.father):p.strain;
    const cnt=p.herm?3+Math.floor(rnd()*5):8+Math.floor(rnd()*12);
    const key=child+'|'+(sk('b3')?'f':'r');
    S.seeds[key]=(S.seeds[key]||0)+cnt;
    seedMsg=` Семена: ${cnt} шт. ${strainOf(child).name}.`;
  } else if(sk('b2')&&rnd()<.3){
    const cnt=1+Math.floor(rnd()*3);const key=p.strain+'|r';S.seeds[key]=(S.seeds[key]||0)+cnt;seedMsg=` Найдено семян: ${cnt}.`;
  }
  S.slots[slot]=null;
  S.stats.harvests++;S.stats.grams+=jar.g;
  addXP(Math.round(20+jar.g*.6+jar.q*.3));
  log(`Урожай ${st.name}: ${fmt(jar.g,1)} г сырья на сушке, прогноз ${gradeOf(jar.q)}, ТГК ${fmt(jar.thc,1)}%.${seedMsg}`,'good');
  if(p.pestMax<1)S.ach._clean=true;
  if(st.cbd>5)S.ach._cbd=true;
  checkAch();
  return jar;
}
function makeHybrid(a,b){
  const key='x_'+[a,b].join('_').replace(/[^a-z0-9_]/gi,'').slice(0,40);
  if(S.custom[key]||STRAINS[key])return key;
  const A=strainOf(a),B=strainOf(b);const stab=sk('b4');
  const v=stab?.04:.1;
  const mix=(x,y)=>(x+y)/2*(1+(rnd()*2-1)*v);
  const best=(x,y)=>stab?Math.max(x,y)*.97:mix(x,y);
  const w1=A.name.split(/[\s#]+/)[0],w2=B.name.split(/[\s#]+/).filter(Boolean).slice(-1)[0];
  let name=w1===w2?A.name+' F2':`${w1} ${w2}`;
  if(Object.values(S.custom).some(c=>c.name===name))name+=' #'+(Object.keys(S.custom).length+1);
  const auto=A.auto&&B.auto;
  S.custom[key]={name,ind:clamp(mix(A.ind,B.ind),.1,.95),auto,veg:auto?Math.round((A.veg+B.veg)/2):0,
    flower:Math.round(mix(A.flower,B.flower)),thc:Math.round((best(A.thc,B.thc)+(A.thc>1&&B.thc>1?(stab?1.5:rnd()*2-.5):0))*10)/10,
    cbd:Math.round(mix(A.cbd,B.cbd)*10)/10,yield:Math.round(best(A.yield,B.yield)),grow:mix(A.grow,B.grow),stretch:mix(A.stretch,B.stretch),
    mold:clamp(best(A.mold,B.mold),.3,.9),value:Math.round((Math.max(A.value,B.value)+.05)*100)/100,price:0,lvl:1,
    purple:(A.purple||B.purple)&&rnd()<.6,custom:true,parents:[A.name,B.name],note:`Твой гибрид: ${A.name} × ${B.name}.`};
  log(`Выведен новый сорт: ${name} (${A.name} × ${B.name})!`,'good');
  S.ach._hybrid=true;
  return key;
}
function collectPollen(slot){

function pricePerG(j){

function refillOrders(){
  const want=sk('t4')?4:3;

}
function genOrder(){
  const pool=Object.entries(STRAINS).filter(([id,s])=>s.lvl<=Math.max(1,(S.level||1)));
  const kind=rnd()<.45?'strain':'type';
  const [sid,st]=pick(pool);
  const grams=pick([10,15,20,25,30,40,50].filter(g=>g<=10+(S.level||1)*8));
  const minG=pick((S.level||1)<3?['D','C']:(S.level||1)<6?['C','B','B']:['B','A','A','S']);
  const qmin={D:0,C:45,B:60,A:75,S:88}[minG];
  const base=4.5*(kind==='strain'?st.value:1)*(.35+Math.pow(Math.max(55,qmin+5)/80,2));
  const reward=Math.round(grams*base*(1.5+rnd()*.6)*(sk('t4')?1.25:1));
  const buyers=['Кофешоп «Туман»','Аптека на Садовой','Клуб «Зелёный лист»','Диспансер «Гармония»','Частный коллекционер','Кооператив гроуеров'];
  return {id:uid(),kind,strain:sid,type:typeOf(st),grams,minG,reward,exp:S.gameH+(6+Math.floor(rnd()*6))*24,who:pick(buyers)};
}
function orderMatches(o,j){
  if(j.phase==='dry'||j.g<o.grams)return false;
  if(GRADE_ORDER.indexOf(gradeOf(j.q))<GRADE_ORDER.indexOf(o.minG))return false;
  if(o.kind==='strain')return j.strain===o.strain;
  return typeOf(strainOf(j.strain))===o.type;
}
function fulfill(oid,jid){
  const o=S.orders.find(x=>x.id===oid),j=S.jars.find(x=>x.id===jid);
  if(!o||!j||!orderMatches(o,j))return;
  j.g=Math.round((j.g-o.grams)*10)/10;if(j.g<.5)S.jars=S.jars.filter(x=>x!==j);
  S.money+=o.reward;S.stats.earned+=o.reward;
  S.orders=S.orders.filter(x=>x!==o);refillOrders();
  addXP(30);log(`Заказ выполнен: ${o.who} заплатил ${fmt(o.reward)} ₵.`,'good');checkAch();
}
function addXP(n){
  S.xp+=n;
  while(S.xp>=xpNeed(S.level)){
    S.xp-=xpNeed(S.level);S.level++;S.sp++;const bonus=40*S.level;S.money+=bonus;
    const un=Object.values(STRAINS).filter(s=>s.lvl===S.level).map(s=>s.name);
    log(`Уровень ${S.level}! +1 очко навыков, +${bonus} ₵.${un.length?' Открыты сорта: '+un.join(', ')+'.':''}`,'good');
    toast(`Уровень ${S.level}! +1 очко навыков`,'good');
    refillOrders();
  }
  checkAch();
}
function checkAch(){
  const has=id=>S.ach[id];
  const give=(id)=>{if(has(id))return;S.ach[id]=S.gameH;const a=ACH.find(x=>x.id===id);S.money+=50;S.xp+=15;log(`Достижение: «${a.name}». +50 ₵`,'good');toast(`Достижение: ${a.name}`,'good');};
  if(S.stats.harvests>=1)give('first');
  if(S.stats.grams>=100)give('g100');
  if(S.stats.grams>=1000)give('kg');
  if(S.jars.some(j=>j.q>=88)||S.stats.best>=88)give('gs');
  if(S.ach._clean)give('clean');
  if(S.ach._hybrid)give('hybrid');
  if(S.ach._cbd)give('cbd');
  if(tentSlots()>=2&&S.slots.every(Boolean))give('full');
  if(S.money>=5000)give('rich');
  if(S.level>=10)give('lvl10');
  for(const j of S.jars)if(j.q>S.stats.best)S.stats.best=j.q;
}

function warnings(p){
  const w=[];if(!p)return w;
  const st=strainOf(p.strain);
  if(!p.alive)return [{l:'bad',t:'Растение погибло'}];
  const env=envNow(S.gameH),tg=stageTarget(p);
  if(p.sex==='M'&&p.sexKnown)w.push({l:'bad',t:p.stage==='flower'&&p.flowerH>=13*24?'Самец пылит! Убери его':'Мужское растение — убери или собери пыльцу'});
  if(p.moist<22)w.push({l:'bad',t:p.medium==='hydro'?'Резервуар почти пуст':'Сухо — нужен полив'});
  else if(p.moist<35)w.push({l:'warn',t:'Скоро полив'});
  if(p.wetH>20)w.push({l:'warn',t:'Перелив — дай просохнуть'});
  if(p.burn)w.push({l:'bad',t:'Ожог удобрениями — пролей чистой водой'});
  const nm={n:'азота (N)',p:'фосфора (P)',k:'калия (K)',cm:'кальмага'};
  for(const d of p.def)w.push({l:'warn',t:'Дефицит '+nm[d]});
  if(p.phUp<.8)w.push({l:'warn',t:S.eq.phmeter?`pH ${fmt(p.ph,1)} — блокировка питания`:'Листья желтеют странно — проверь pH'});
  if(env.t>tg.t[1]+1)w.push({l:'warn',t:`Жарко: ${fmt(env.t)}°C`});
  if(env.t<tg.t[0]-1)w.push({l:'warn',t:`Холодно: ${fmt(env.t)}°C`});
  if(env.rh>tg.rh[1]+3)w.push({l:'warn',t:`Влажность ${fmt(env.rh)}% — высоко для стадии`});
  if(env.rh<tg.rh[0]-3)w.push({l:'warn',t:`Влажность ${fmt(env.rh)}% — сухо для стадии`});
  const thr=S.eq.loupe?3:8;
  for(const k in p.pest)if(p.pest[k]>thr)w.push({l:p.pest[k]>40?'bad':'warn',t:`${PESTS[k]} · ${fmt(p.pest[k])}%`});
  if(p.stress>60)w.push({l:'warn',t:'Сильный стресс'});
  if(p.stage==='veg'&&!st.auto&&S.sched>12&&p.stageH>=28*24)w.push({l:'info',t:'Можно переводить на 12/12'});
  if(p.stage==='flower'&&!st.auto&&S.sched>12)w.push({l:'warn',t:'Цветение стоит: нужен свет 12/12'});
  if(p.stage==='flower'&&p.sex!=='M'){
    const f=fp(p);
    if(f>=.82&&f<1.1&&p.sinceFeed<3*24)w.push({l:'info',t:'Пора промывка — поливай чистой водой'});
    if(f>=.9&&f<1.2)w.push({l:'good',t:'Окно сбора открыто'});
    if(f>=1.2)w.push({l:'bad',t:'Перезревает — собирай'});
  }
  if(p.pollinated&&p.stage==='flower')w.push({l:'info',t:'Опылён(а) — наливаются семена'});
  if(p.recoverH>0)w.push({l:'info',t:'Восстанавливается после топпинга'});
  if(!w.length)w.push({l:'good',t:'Всё в порядке'});
  return w;
}
function stageLabel(p){
  if(!p)return 'Пусто';
  if(!p.alive)return 'Погиб';
  if(p.stage==='germ')return 'Проращивание';
  if(p.stage==='seed')return 'Росток';
  if(p.stage==='veg')return 'Вегетация';
  if(p.sex==='M')return 'Цветение ♂';
  const f=fp(p);
  if(f<.15)return 'Предцвет';if(f<.8)return 'Цветение';if(f<1.3)return 'Созревание';return 'Перезрел';
}
function nodeCount(p){
  if(p.stage==='germ')return 0;
  if(p.stage==='seed')return 1+Math.min(2,Math.floor(p.stageH/24/5));
  if(p.stage==='veg')return Math.min(13,3+Math.floor(p.stageH/24/2.8));
  if(p.stage==='flower')return Math.min(16,p.nodesFlip+Math.floor(Math.min(fp(p),.35)*10));
  return p.nodesFlip||6;
}
function etaDays(p){
  const st=strainOf(p.strain);
  if(p.stage==='germ')return {d:(72-p.germH)/24+(st.auto?12:14)+(st.auto?st.veg:28)+st.flower,note:'примерно до сбора'};
  if(p.stage==='seed')return {d:((st.auto?12:14)*24-p.stageH)/24+(st.auto?st.veg:28)+st.flower,note:st.auto?'до сбора':'до сбора, если вегетация 4 недели'};
  if(p.stage==='veg')return st.auto?{d:(st.veg*24-p.stageH)/24+st.flower,note:'до сбора'}:{d:st.flower,note:'цветения после перевода на 12/12'};
  if(p.stage==='flower')return {d:Math.max(0,(st.flower*24-p.flowerH)/24),note:'до пика созревания'};
  return {d:0,note:''};
}
function realDur(days){
  const ms=days*msPerDay();const m=ms/60000;
  if(m<60)return `${Math.max(1,Math.round(m))} мин`;
  const h=m/60;if(h<48)return `${fmt(h,h<10?1:0)} ч`;
  return `${fmt(h/24,1)} дн`;
}

  c.fillStyle='#2b2431';c.fillRect(W/2-lw/2,lampY,lw,10);

  c.fillStyle=fg;c.fillRect(0,floorY-30,W,H-floorY+30);

// тон листа: [h,s,l] в зависимости от здоровья, дефицитов, позиции t (0 низ .. 1 верх)
function leafTone(p,t){
  const st=strainOf(p.strain),f=fp(p);
  if(!p.alive)return [32,30,27];
  let h=104-(st.ind-.5)*12,s=52,l=27+(1-st.ind)*6;
  const hp=p.health/100;
  s*=.6+.4*hp;l+=(1-hp)*7;h-=(1-hp)*28;
  const nDef=p.def.includes('n');
  if(nDef||(p.stage==='flower'&&f>.72)){
    const fade=nDef?.85:clamp((f-.72)/.5,0,1);
    const k=clamp((.7-t)*1.5,0,1)*fade;
    h=lerp(h,52,k);s=lerp(s,68,k);l=lerp(l,50,k);
  }
  if(st.purple&&p.stage==='flower'&&f>.65){const k=clamp((f-.65)*1.4,0,.55)*clamp(t+.3,0,1);h=lerp(h,285,k);s=lerp(s,40,k);l-=k*5;}
  if(p.phUp<.7){h-=12;s-=8;l+=3;}
  if(p.moist<12){l-=2;s-=10;}
  return [h,s,l];
}
const LEAFLET_OFFS={1:[0],3:[-.55,0,.55],5:[-1.1,-.55,0,.55,1.1],7:[-1.5,-1.05,-.52,0,.52,1.05,1.5],9:[-1.75,-1.35,-.92,-.46,0,.46,.92,1.35,1.75]};

// один зубчатый листочек; основание в (0,0), направлен по +x, изгиб bend вниз по локальному y
function leaflet(c,len,wr,bend,tone,dl,burn,spots){
  const N=Math.max(8,Math.min(30,Math.round(len/1.6)));
  const top=[],bot=[],spine=[];
  for(let i=0;i<=N;i++){
    const t=i/N;
    const sx=t*len,sy=bend*len*t*t;
    const tx=len,ty=2*bend*len*t,nl=Math.hypot(tx,ty),nx=-ty/nl,ny=tx/nl;
    let hw=len*wr*Math.pow(Math.sin(Math.PI*Math.pow(t,.72)),1.15);
    if(t<.05)hw*=t/.05;
    // зубчики, наклонённые к кончику
    const tooth=i%2===0?1:.68;
    const w=hw*(i>1&&i<N?tooth:1);
    const fwd=i%2===0?len*.012:0;
    top.push([sx+fwd-nx*w,sy-ny*w]);bot.push([sx+fwd+nx*w,sy+ny*w]);spine.push([sx,sy]);
  }
  const [h,s,l]=tone;
  c.beginPath();c.moveTo(0,0);for(const q of top)c.lineTo(q[0],q[1]);for(let i=bot.length-1;i>=0;i--)c.lineTo(bot[i][0],bot[i][1]);c.closePath();
  c.fillStyle=hsl(h,s,l+dl);c.fill();
  // затенённая половинка — лист сложен «лодочкой»
  c.beginPath();c.moveTo(0,0);for(const q of spine)c.lineTo(q[0],q[1]);for(let i=bot.length-1;i>=0;i--)c.lineTo(bot[i][0],bot[i][1]);c.closePath();
  c.fillStyle='rgba(0,20,0,.16)';c.fill();
  if(burn){const s0=Math.floor(N*.8);c.beginPath();c.moveTo(top[s0][0],top[s0][1]);for(let i=s0;i<=N;i++)c.lineTo(top[i][0],top[i][1]);for(let i=N;i>=s0;i--)c.lineTo(bot[i][0],bot[i][1]);c.closePath();c.fillStyle='#8a5a2b';c.fill();}
  if(len>6){c.strokeStyle=hsl(h-4,s*.55,Math.min(80,l+dl+16));c.globalAlpha=.75;c.lineWidth=Math.max(.35,len*.018);c.beginPath();c.moveTo(0,0);for(let i=1;i<spine.length-1;i++)c.lineTo(spine[i][0],spine[i][1]);c.stroke();c.globalAlpha=1;}
  if(spots){c.fillStyle=spots;for(let i=1;i<5;i++){const q=spine[Math.floor(N*i/5.5)];c.beginPath();c.arc(q[0]+((i*13)%5-2)*len*.012,q[1]+((i*7)%3-1)*len*wr*.3,Math.max(.6,len*.03),0,7);c.fill();}}
}
// лист-пятерня: черешок + веер листочков
function fanLeaf(c,x,y,ang,len,n,wr,tone,dl,droop,burn,spots,petFrac=.42){
  const pl=len*petFrac;
  const sag=pl*(.1+droop*.35);
  const ex=x+Math.cos(ang)*pl,ey=y+Math.sin(ang)*pl+sag;
  const [h,s,l]=tone;
  c.strokeStyle=hsl(h+6,s*.7,l+dl+6);c.lineWidth=Math.max(.5,len*.028);c.lineCap='round';
  c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+Math.cos(ang)*pl*.6,y+Math.sin(ang)*pl*.6-pl*.05,ex,ey);c.stroke();
  const dir=Math.atan2(ey-y,ex-x);
  const offs=LEAFLET_OFFS[n]||LEAFLET_OFFS[7];
  const order=offs.map((o,i)=>i).sort((a,b)=>Math.abs(offs[b])-Math.abs(offs[a]));
  for(const i of order){
    const o=offs[i];
    const a=dir+o*(1+droop*.15);
    const lk=n===1?1:1-Math.pow(Math.abs(o)/1.85,1.5)*.82;
    const L=len*(1-petFrac*.55)*lk;
    const down=Math.cos(a)>=0?1:-1;
    const bend=(.1+droop*.35+Math.max(0,-Math.sin(a))*.08)*down;
    c.save();c.translate(ex,ey);c.rotate(a);
    leaflet(c,L,wr,bend,tone,dl,burn,spots);
    c.restore();
  }
}
// шишка/кола вдоль оси: (x,y) — верхушка, растёт вниз-вдоль ang (обычно вниз по стеблю)
function drawCola(c,x,y,ang,Lc,R,p,rng,tone){
  const st=strainOf(p.strain),f=fp(p),tr=trichomes(p);
  const frost=clamp((f-.25)/.6,0,1);
  let cal=[118,178,74];
  if(st.purple&&f>.55){const k=clamp((f-.55)*1.7,0,.85);cal=[lerp(118,120,k),lerp(178,64,k),lerp(74,150,k)];}
  if(!p.alive)cal=[112,92,62];
  const rot=p.pest.rot>(S.eq.loupe?3:8);
  const M=Math.max(2,Math.round(Lc/(R*.55)));
  const ca=Math.cos(ang),sa=Math.sin(ang);
  const pts=[];
  for(let j=0;j<=M;j++){
    const s=j/M;
    const rr=R*(.38+.62*Math.min(1,s*2.4))*(1-.22*s);
    pts.push([x+ca*Lc*s,y+sa*Lc*s,rr]);
  }
  // сахарные листики за шишкой
  for(let j=1;j<pts.length;j+=2){
    const [px,py,rr]=pts[j];
    for(const side of [-1,1]){
      const a=ang+Math.PI+side*(.9+rng()*.5);
      c.save();c.translate(px,py);c.rotate(a);
      leaflet(c,rr*2.1,.16,.08*(Math.cos(a)>=0?1:-1),tone,4,false,null);
      c.restore();
    }
  }
  // чашечки снизу вверх
  for(let j=pts.length-1;j>=0;j--){
    const [px,py,rr]=pts[j];
    const k=5+Math.round(rr/2);
    for(let q=0;q<k;q++){
      const a=rng()*Math.PI*2,d=rr*Math.sqrt(rng())*.75;
      const qx=px+Math.cos(a)*d,qy=py+Math.sin(a)*d*.8;
      const cr=rr*(.32+rng()*.18);
      const shade=.85+rng()*.25;
      c.fillStyle=`rgb(${cal[0]*shade|0},${cal[1]*shade|0},${cal[2]*shade|0})`;
      c.beginPath();c.ellipse(qx,qy,cr*.75,cr,ang+Math.PI/2+(rng()-.5)*.9,0,7);c.fill();
    }
    if(rot&&j>M*.4){c.fillStyle='rgba(92,72,52,.8)';c.beginPath();c.arc(px+rr*.2,py,rr*.55,0,7);c.fill();}
  }
  // иней трихом
  if(frost>0){
    const col=`rgba(${lerp(248,238,tr.amber*1.4)|0},${lerp(248,205,tr.amber*1.4)|0},${lerp(242,150,tr.amber*1.4)|0},`;
    for(const [px,py,rr] of pts){
      const n=Math.round(6+rr*1.6*frost);
      for(let q=0;q<n;q++){const a=rng()*Math.PI*2,d=rr*Math.sqrt(rng())*.9;c.fillStyle=col+(.35+.55*frost)+')';c.beginPath();c.arc(px+Math.cos(a)*d,py+Math.sin(a)*d,Math.max(.35,rr*.07),0,7);c.fill();}
    }
  }
  // пестики
  const pc=f<.5?[246,242,230]:f<1?[lerp(246,214,(f-.5)/.5),lerp(242,112,(f-.5)/.5),lerp(230,40,(f-.5)/.5)]:[140,74,38];
  c.strokeStyle=`rgb(${pc[0]|0},${pc[1]|0},${pc[2]|0})`;c.lineWidth=Math.max(.35,R*.06);
  const hairs=Math.round(pts.length*(f<1?3:1.5));
  for(let q=0;q<hairs;q++){
    const [px,py,rr]=pts[Math.floor(rng()*pts.length)];
    const a=rng()*Math.PI*2;const x0=px+Math.cos(a)*rr*.6,y0=py+Math.sin(a)*rr*.6;
    const ln=rr*(f<1?.9:.5);
    c.beginPath();c.moveTo(x0,y0);c.quadraticCurveTo(x0+Math.cos(a)*ln*.7,y0+Math.sin(a)*ln*.2-ln*.4,x0+Math.cos(a+.6)*ln,y0-ln*.5);c.stroke();
  }
}
function pistilTuft(c,x,y,r){
  c.strokeStyle='#f3efe4';c.lineWidth=.5;
  for(let i=0;i<5;i++){const a=-Math.PI/2+(i-2)*.45;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+Math.cos(a)*r*.6,y+Math.sin(a)*r*.6-1,x+Math.cos(a)*r,y+Math.sin(a)*r);c.stroke();}
  c.fillStyle='#8fc15e';c.beginPath();c.ellipse(x,y+1,r*.35,r*.5,0,0,7);c.fill();
}
function drawSacs(c,x,y,r,rng){
  for(let i=0;i<7;i++){const a=rng()*Math.PI*2,d=r*rng();c.fillStyle=i%2?'#c9d27a':'#aebd5e';c.beginPath();c.ellipse(x+Math.cos(a)*d,y+Math.abs(Math.sin(a))*d*1.2,r*.32,r*.4,0,0,7);c.fill();}
}
// верхушка роста — пучок молодых листьев
function apex(c,x,y,len,wr,tone,droop){
  fanLeaf(c,x,y,-Math.PI/2-.75,len*.8,5,wr,tone,6,droop*.5,false,null,.3);
  fanLeaf(c,x,y,-Math.PI/2+.75,len*.8,5,wr,tone,6,droop*.5,false,null,.3);
  fanLeaf(c,x,y,-Math.PI/2,len*.55,3,wr,tone,10,0,false,null,.2);
}

function drawPlant(c,cx,soilY,p,rng,availH,env){
  const st=strainOf(p.strain);
  const f=fp(p),flowering=p.stage==='flower',male=p.sex==='M';
  const hVis=Math.max(2,p.height*(p.scrog?.8:1)*(p.lst?.88:1));
  const pxcm=Math.min(3.4+7*clamp(1-hVis/35,0,1),availH/Math.max(hVis,16));
  const H=Math.max(8,hVis*pxcm);
  const N=Math.max(1,nodeCount(p));
  const wr=.085+st.ind*.07;
  const droop=!p.alive?1:p.moist<12?.8:p.wetH>24?.4:0;
  const leafL=clamp(H*.25,7,44);
  const spread=(p.lst?1.5:1)*(p.scrog?1.15:1)*(1.12-st.ind*.22);
  const stemW=clamp(.9+p.height*.045,.9,6.5);
  const stemCol=p.alive?hsl(88,32,34):'#5a4630';
  const sway=(rng()-.5)*4;
  const burn=p.burn;
  let spots=null;
  if(p.pest.mildew>(S.eq.loupe?3:8))spots='rgba(242,242,236,.85)';
  else if(p.def.includes('cm'))spots='rgba(135,78,32,.7)';
  const back=[],mid=[],colas=[],sacs=[],tufts=[],stems=[];
  const stemX=t=>cx+sway*t+Math.sin(t*3.1)*1.2;
  const tNode=i=>1-Math.pow(1-(i+1)/(N+1),1.18);
  const topped=p.topped>0&&p.stage!=='seed';
  const splitT=topped?(p.topped===1?.62:.55):1;
  // --- росток ---
  if(p.stage==='seed'){
    const tone=leafTone(p,.5);
    stems.push({pts:[[cx,soilY],[cx+sway*.5,soilY-H*.5],[cx+sway,soilY-H]],w:stemW});
    // семядоли
    for(const s of [-1,1])mid.push(()=>{c.fillStyle=hsl(96,40,42);c.beginPath();c.ellipse(cx+s*H*.13,soilY-H*.32,H*.13,H*.06,s*.25,0,7);c.fill();});
    for(let i=1;i<=N;i++){
      const t=Math.min(1,.45+i*.2),y=soilY-H*t,x=cx+sway*t,n=i===1?1:i===2?3:5,L=leafL*(i===1?.55:.75);
      const a=-.35+(i%2?0:.15);
      mid.push(()=>fanLeaf(c,x,y,a,L,n,wr,tone,2,droop,burn,spots,.3));
      mid.push(()=>fanLeaf(c,x,y,-Math.PI-a,L,n,wr,tone,0,droop,burn,spots,.3));
    }
    for(const s of stems){c.strokeStyle=stemCol;c.lineWidth=s.w;c.beginPath();c.moveTo(s.pts[0][0],s.pts[0][1]);c.quadraticCurveTo(s.pts[1][0],s.pts[1][1],s.pts[2][0],s.pts[2][1]);c.stroke();}
    mid.forEach(fn=>fn());
    apex(c,cx+sway,soilY-H,leafL*.35,wr,tone,droop);
    return;
  }
  // --- главный стебель ---
  const topY=soilY-H;
  const splitY=soilY-H*splitT;
  stems.push({pts:[[cx,soilY],[stemX(splitT*.5),soilY-H*splitT*.5],[stemX(splitT),splitY]],w:stemW});
  const leaders=[];
  if(topped){
    const k=p.topped===1?2:4;
    for(let i=0;i<k;i++){
      const o=k===1?0:(i-(k-1)/2)/((k-1)/2);
      const tx=stemX(splitT)+o*H*.22*spread,ty=topY+Math.abs(o)*H*.05;
      leaders.push({x0:stemX(splitT),y0:splitY,x:tx,y:ty});
      stems.push({pts:[[stemX(splitT),splitY],[stemX(splitT)+o*H*.05,splitY-(splitY-ty)*.55],[tx,ty]],w:stemW*.7});
    }
  } else leaders.push({x0:cx,y0:soilY,x:stemX(1),y:topY});
  // --- узлы главного стебля ---
  const vegAgeNodes=N;
  for(let i=0;i<N;i++){
    const t=tNode(i)*splitT;
    if(topped&&t>splitT-.04)break;
    const y=soilY-H*t,x=stemX(t);
    const tone=leafTone(p,t);
    const sizeK=clamp(1.02-t*.55,.45,1);
    const L=leafL*sizeK;
    const n=Math.min(st.ind>.62?7:9,3+2*i);
    const faceOn=i%2===0; // пары листьев чередуются на 90°
    if(p.defol>0&&t<.35&&i%2===1){}else if(faceOn){
      const a=-.18+(rng()-.5)*.35;
      mid.push(()=>fanLeaf(c,x,y,a,L,n,wr,tone,0,droop,burn,spots));
      mid.push(()=>fanLeaf(c,x,y,-Math.PI-a+(rng()-.5)*.2,L*.96,n,wr,tone,-2,droop,burn,spots));
    } else {
      const s=rng()<.5?1:-1;
      back.push(()=>fanLeaf(c,x,y,-Math.PI/2+s*(1.05+rng()*.3),L*.72,n,wr,tone,-9,droop,burn,spots));
      mid.push(()=>fanLeaf(c,x,y,-Math.PI/2-s*(.75+rng()*.3),L*.62,n,wr,tone,5,droop,burn,spots));
    }
    // боковые ветки (вырастают из пазух, нижние длиннее)
    const above=N-1-i;
    if(i>=1&&t<.9){
      const grow=clamp(above/4,0,1);
      const Lb=H*.5*spread*Math.pow(1-t,.8)*grow*(faceOn?1:.6);
      if(Lb>leafL*.35){
        for(const side of [-1,1]){
          const tilt=(p.lst?1.25:.5+.35*(1-t))*(faceOn?1:.7);
          const ex=x+side*Math.sin(tilt)*Lb*.9,ey=y-Math.cos(tilt)*Lb*.9-Lb*.22;
          const qx=x+side*Math.sin(tilt)*Lb*.55,qy=y-Math.cos(tilt)*Lb*.35;
          stems.push({pts:[[x,y],[qx,qy],[ex,ey]],w:Math.max(.6,stemW*.42*(1-t*.5)),back:!faceOn&&side>0});
          // листья на ветке
          const m=Math.max(1,Math.min(4,Math.floor(Lb/(leafL*.5))));
          for(let j=1;j<=m;j++){
            const u=j/(m+1);
            const bx=(1-u)*(1-u)*x+2*(1-u)*u*qx+u*u*ex,by=(1-u)*(1-u)*y+2*(1-u)*u*qy+u*u*ey;
            const ls=j%2?side:-side;
            const bt=leafTone(p,t+u*.15);
            const la=ls>0?-.1-rng()*.4:-Math.PI+.1+rng()*.4;
            (j%2?mid:back).push(()=>fanLeaf(c,bx,by,la,L*.62*(1-u*.35),Math.max(5,n-2),wr,bt,j%2?1:-6,droop,burn,spots));
          }
          const tipTone=leafTone(p,Math.min(1,t+.2));
          if(flowering&&!male&&f>=.1){
            const g=Math.pow(clamp(f/.85,0,1),.75)*clamp(.8+p.bud/170,.8,1.4);
            colas.push(()=>drawCola(c,ex,ey,Math.PI/2+side*.25,Math.max(3,Lb*.42*g),clamp(leafL*.16,1.6,7)*(.55+.45*g),p,rng,tipTone));
          } else if(flowering&&!male)tufts.push(()=>pistilTuft(c,ex,ey,leafL*.12));
          else if(flowering&&male)sacs.push(()=>drawSacs(c,ex,ey,leafL*.13,rng));
          else mid.push(()=>apex(c,ex,ey,leafL*.32,wr,tipTone,droop));
        }
      }
    }
    if(flowering&&male&&i>N*.4)sacs.push(()=>drawSacs(c,x,y-2,leafL*.11,rng));
  }
  // листья на лидерах после топпинга
  if(topped)for(const ld of leaders){
    for(const u of [.35,.7]){
      const x=lerp(ld.x0,ld.x,u),y=lerp(ld.y0,ld.y,u),tone=leafTone(p,.8);
      mid.push(()=>fanLeaf(c,x,y,-.2,leafL*.55,7,wr,tone,2,droop,burn,spots));
      mid.push(()=>fanLeaf(c,x,y,-Math.PI+.2,leafL*.5,7,wr,tone,-2,droop,burn,spots));
    }
  }
  // верхушки
  const topTone=leafTone(p,1);
  for(const ld of leaders){
    if(flowering&&!male&&f>=.1){
      const g=Math.pow(clamp(f/.85,0,1),.7)*clamp(.8+p.bud/170,.8,1.45);
      colas.push(()=>drawCola(c,ld.x,ld.y,Math.PI/2,Math.max(4,H*(topped?.2:.3)*g),clamp(leafL*.24,2,11)*(.55+.45*g),p,rng,topTone));
    } else if(flowering&&!male){tufts.push(()=>pistilTuft(c,ld.x,ld.y,leafL*.15));mid.push(()=>apex(c,ld.x,ld.y,leafL*.4,wr,topTone,droop));}
    else if(flowering&&male){sacs.push(()=>drawSacs(c,ld.x,ld.y,leafL*.16,rng));}
    else mid.push(()=>apex(c,ld.x,ld.y,leafL*.45,wr,topTone,droop));
  }
  // --- отрисовка слоями ---
  const drawStem=s=>{c.strokeStyle=stemCol;c.lineWidth=s.w;c.lineCap='round';c.beginPath();c.moveTo(s.pts[0][0],s.pts[0][1]);c.quadraticCurveTo(s.pts[1][0],s.pts[1][1],s.pts[2][0],s.pts[2][1]);c.stroke();};
  back.forEach(fn=>fn());
  stems.filter(s=>s.back).forEach(drawStem);
  stems.filter(s=>!s.back).forEach(drawStem);
  mid.forEach(fn=>fn());
  sacs.forEach(fn=>fn());
  tufts.forEach(fn=>fn());
  colas.forEach(fn=>fn());
  // паутина клеща
  if(p.pest.mites>(S.eq.loupe?3:8)){
    c.strokeStyle=`rgba(235,235,235,${clamp(p.pest.mites/120,.12,.55)})`;c.lineWidth=.45;
    for(let i=0;i<Math.ceil(p.pest.mites/12)+1;i++){const ld=leaders[i%leaders.length];c.beginPath();c.moveTo(ld.x-14+rng()*8,ld.y+rng()*24);c.quadraticCurveTo(ld.x,ld.y-4,ld.x+10+rng()*8,ld.y+rng()*26);c.stroke();}
  }
}

function gaugeRow(label,val,max,zone,color,txt){
  const w=clamp(val/max*100,0,100);
  return `<div class="g"><span class="lab">${label}</span><div class="track"><div class="zone" style="left:${zone[0]/max*100}%;width:${(zone[1]-zone[0])/max*100}%"></div><div class="fill" style="width:${w}%;background:${color}"></div></div><span class="val">${txt}</span></div>`;
}
function updateBox(){
  const p=curPlant();const cv=$('#cv');
  const env=envNow(S.gameH);
  const fh=$('#fhead'),mt=$('#meters');
  if(fh){
    if(p){
      const st=strainOf(p.strain);
      const day=p.stage==='flower'?`цветение · день ${Math.floor(p.flowerH/24)+1}`:`день ${Math.floor(p.ageH/24)+1}`;
      const est=p.stage==='flower'&&p.sex!=='M'&&p.alive?` · ≈ ${fmt(estimate(p).g)} г`:'';
      fh.innerHTML=`<div class="fname">${esc(st.name)}</div><div class="fsub"><span class="pill stage">${esc(stageLabel(p).toUpperCase())}</span><span class="mono">${day} · ${fmt(p.height)} см${est}</span></div>`;
    } else fh.innerHTML=`<div class="fname">Место ${S.sel+1} свободно</div><div class="fsub"><span class="mono">${esc(POTS[S.eq.pot].name)} ждёт семя</span></div>`;
  }
  if(mt){
    const tg=stageTarget(p||leadPlant());
    const okT=env.t>=tg.t[0]&&env.t<=tg.t[1],okR=env.rh>=tg.rh[0]&&env.rh<=tg.rh[1];
    const m=(ic,v,frac,col,lbl)=>`<div class="mt" style="--c:${col}" title="${lbl}">${icon(ic)}<b class="mono">${v}</b><i style="--f:${clamp(frac,0,1)}"></i></div>`;
    let h='';
    if(p&&p.alive){
      h+=m('drop',Math.round(p.moist)+'%',p.moist/100,p.moist<25?'var(--bad)':p.moist<35?'var(--warn)':'var(--water)','Влага');
      h+=m('heart',Math.round(p.health)+'%',p.health/100,p.health>70?'var(--leaf)':p.health>40?'var(--warn)':'var(--bad)','Здоровье');
    }
    h+=m('temp',fmt(env.t)+'°',(env.t-12)/24,okT?'var(--text)':'var(--warn)','Температура');
    h+=m('hum',Math.round(env.rh)+'%',env.rh/100,okR?'var(--text)':'var(--warn)','Влажность');
    mt.innerHTML=h;
  }
  const cv2=$('#cv');if(cv2)drawScene(cv2,p,stagePads());
  const wEl=$('#warns');
  if(wEl&&p){const ws=warnings(p);const ord={bad:0,warn:1,info:2,good:3};ws.sort((a,b)=>ord[a.l]-ord[b.l]);const show=ws.slice(0,2);wEl.innerHTML=show.map(w=>`<span class="w ${w.l}">${esc(w.t)}</span>`).join('')+(ws.length>2?`<span class="w more">+${ws.length-2}</span>`:'');}
  if(wEl&&!p)wEl.innerHTML='';
  const wf=$('#warnsFull');if(wf&&p)wf.innerHTML=warnings(p).map(w=>`<span class="w ${w.l}">${esc(w.t)}</span>`).join('');
  const g=$('#gauges');
  if(g&&p){
    const M=MEDIA[p.medium];
    const nb=(k,label)=>{const v=p.nut[k];const col=v>burnThr()?'var(--bad)':v<12?'var(--warn)':'var(--leaf)';return `<div class="nb"><div class="top"><span class="muted">${label}</span><b>${Math.round(v)}</b></div><div class="track"><div class="zone" style="left:12%;width:${burnThr()-12}%"></div><div class="fill" style="width:${clamp(v,0,100)}%;background:${col}"></div></div></div>`;};
    const phTxt=S.eq.phmeter?fmt(p.ph,1):'?';
    const phCol=p.phUp>=.95?'var(--leaf)':p.phUp>=.75?'var(--warn)':'var(--bad)';
    let extra='';
    if(p.stage==='flower'&&p.sex!=='M'){
      const e=estimate(p);
      const tri=S.eq.loupe?`<div class="stat" style="grid-column:1/-1"><div class="k">Трихомы (лупа)</div><div class="trich"><i style="width:${e.tr.clear*100}%;background:#dfe8ee"></i><i style="width:${e.tr.milky*100}%;background:#b9b0c4"></i><i style="width:${e.tr.amber*100}%;background:#e0a040"></i></div><div class="tiny muted" style="margin-top:4px">прозрачные ${Math.round(e.tr.clear*100)}% · мутные ${Math.round(e.tr.milky*100)}% · янтарные ${Math.round(e.tr.amber*100)}%</div></div>`:'';
      extra=`<div class="split" style="margin-top:4px"><div class="stat"><div class="k">Урожай сейчас</div><div class="v">${fmt(e.g)} г</div></div><div class="stat"><div class="k">Качество · ТГК</div><div class="v">${gradeOf(e.q)} · ${st_thc(e)}</div></div>${tri}</div>`;
    }
    g.innerHTML=
      gaugeRow(p.medium==='hydro'?'Резервуар':'Влага',p.moist,100,[30,85],'var(--water)',Math.round(p.moist)+'%')+
      `<div class="nutri">${nb('n','N')}${nb('p','P')}${nb('k','K')}${nb('cm','CaMg')}</div>`+
      gaugeRow('pH',S.eq.phmeter?p.ph-4:0,4.5,[M.ideal[0]-4,M.ideal[1]-4],phCol,phTxt)+
      gaugeRow('Здоровье',p.health,100,[70,100],p.health>70?'var(--leaf)':p.health>40?'var(--warn)':'var(--bad)',Math.round(p.health)+'%')+
      gaugeRow('Стресс',p.stress,100,[0,30],p.stress<30?'#8a7d92':p.stress<60?'var(--warn)':'var(--bad)',Math.round(p.stress)+'%')+
      extra;
  }
  const tEl=$('#timeline');
  if(tEl&&p)tEl.innerHTML=timeline(p);
  const ev=$('#envVals');
  if(ev){
    const tg=stageTarget(leadPlant());
    const okT=env.t>=tg.t[0]&&env.t<=tg.t[1],okR=env.rh>=tg.rh[0]&&env.rh<=tg.rh[1];
    ev.innerHTML=`<div class="stat"><div class="k">Температура</div><div class="v" style="color:${okT?'var(--text)':'var(--warn)'}">${fmt(env.t,1)}°C</div><div class="tiny muted">норма ${tg.t[0]}–${tg.t[1]}</div></div>
    <div class="stat"><div class="k">Влажность</div><div class="v" style="color:${okR?'var(--text)':'var(--warn)'}">${Math.round(env.rh)}%</div><div class="tiny muted">норма ${tg.rh[0]}–${tg.rh[1]} · ${tg.name}</div></div>`;
  }
}
function st_thc(e){return e.cbd>5?`CBD ${fmt(e.cbd,0)}%`:`${fmt(e.thc,1)}%`;}
function timeline(p){
  const st=strainOf(p.strain);
  const seedD=st.auto?12:14,vegD=st.auto?st.veg:Math.max(28,p.stage==='veg'?Math.ceil(p.stageH/24)+1:(p.stage==='flower'?Math.round((p.ageH-p.flowerH-p.germH)/24)-seedD:28));
  const segs=[['Прор.',3,'#9c8fa6'],['Росток',seedD,'#9fd07a'],['Вега',vegD,'#6fae45'],['Цветение',st.flower,'#e7a44a'],['Сушка',7,'#b58a6a']];
  const total=segs.reduce((a,s)=>a+s[1],0);
  let pos=0;
  if(p.stage==='germ')pos=p.germH/24;
  else if(p.stage==='seed')pos=3+p.stageH/24;
  else if(p.stage==='veg')pos=3+seedD+p.stageH/24;
  else if(p.stage==='flower')pos=3+seedD+vegD+Math.min(p.flowerH/24,st.flower*1.1);
  const eta=etaDays(p);
  return `<div class="tl">${segs.map(s=>`<div style="width:${s[1]/total*100}%;background:${s[2]}">${s[1]/total>.12?s[0]:''}</div>`).join('')}<i class="mark" style="left:calc(${clamp(pos/total*100,0,100)}% - 1px)"></i></div>
  <div class="small muted" style="margin-top:6px">${p.alive?`≈ ${fmt(eta.d,eta.d<3?1:0)} игр. дн. ${eta.note} — это ${realDur(eta.d)} реального времени.`:'—'} ${st.auto?'':'Длина вегетации зависит от тебя: дольше вега — больше куст и урожай.'}</div>`;
}

  const st=S.stats;
  const ach=ACH.map(a=>`<div class="card" style="${S.ach[a.id]?'':'opacity:.5'}"><div class="hd"><div><div class="ttl">${esc(a.name)}</div><div class="sub">${esc(a.desc)}</div></div>${S.ach[a.id]?'<span class="own">получено</span>':''}</div></div>`).join('');
  const lg=S.log.slice(0,60).map(e=>`<div class="le ${e.k}"><span class="t">д${Math.floor(e.h/24)+1} ${String(Math.floor(e.h%24)).padStart(2,'0')}:00</span><span class="x">${esc(e.t)}</span></div>`).join('');
  const speeds=SPEEDS.map(s=>`<button class="${S.speed===s.id?'on':''}" data-act="speed" data-id="${s.id}">${s.label}</button>`).join('');
  const sp=SPEEDS.find(s=>s.id===S.speed);
  view().innerHTML=`<h2>Журнал</h2>
  <div class="split"><div class="stat"><div class="k">Урожаев</div><div class="v">${st.harvests}</div></div><div class="stat"><div class="k">Собрано</div><div class="v">${fmt(st.grams,0)} г</div></div><div class="stat"><div class="k">Заработано</div><div class="v">${money(st.earned)}</div></div><div class="stat"><div class="k">Лучший класс</div><div class="v">${st.best?gradeOf(st.best):'—'}</div></div></div>
  <h3>Скорость времени</h3>
  <div class="panel"><div class="seg" style="margin-top:0">${speeds}</div><div class="small muted" style="margin-top:8px">${sp.hint}. Все сроки в игре настоящие: проращивание 3 дня, росток 2 недели, цветение 8–11 недель. Скорость лишь сжимает игровой день.</div>
  <div class="togs"><button class="tog ${S.paused?'on':''}" data-act="pause">${S.paused?'Время на паузе — продолжить':'Поставить время на паузу'}</button><button class="tog ${S.autoPh?'on':''}" data-act="autoPh">Автополив корректирует pH</button></div></div>
  <h3>Как играть</h3>
  <div class="panel guide">
  <p><b>Полив.</b> Поливай, когда влага упала ниже ~35%. Полив по мокрому субстрату душит корни и приводит грибного комара.</p>
  <p><b>Питание.</b> N нужен в веге, P и K — в цветении. Больше ~88 — ожог, меньше 12 — дефицит. Чистая вода вымывает лишнее.</p>
  <p><b>pH.</b> Вода из-под крана 7.4. Почва терпит 6.0–7.0, кокос и гидро — 5.5–6.5. Вне нормы корни не берут питание, даже если его много.</p>
  <p><b>Свет.</b> Фотопериодные сорта цветут только на 12/12 — переводи, когда куст вырос до нужного размера. Растение вытянется ещё в 1.5–2 раза. Автоцветы зацветают сами.</p>
  <p><b>Климат.</b> Росткам нужна влажность 60–75%, цветению — 40–50%. Сырость в конце цветения даёт серую гниль, жара с сухостью — паутинного клеща.</p>
  <p><b>Сбор.</b> Смотри на трихомы: мутные — пик ТГК, янтарные — расслабляющий эффект. За неделю до сбора поливай чистой водой — это промывка, качество вырастет.</p>
  <p><b>Селекция.</b> Регулярные семена дают самцов. Собери с самца пыльцу и опыли самку другого сорта — из семян вырастет твой гибрид.</p>
  </div>
  <h3>Достижения</h3><div class="list">${ach}</div>
  <h3>События</h3><div class="log">${lg}</div>
  <h3>Сброс</h3><div class="panel small"><button class="bb" data-act="resetAsk">Начать заново</button></div>`;
  lastSig='log'+S.log.length+(S.log[0]?S.log[0].h:0)+S.speed+S.paused+S.autoPh+Object.keys(S.ach).length;
}

/* ---------- SHEETS ---------- */
function openSheet(html,kind){
  sheetKind=kind||null;
  $('#sheetRoot').innerHTML=`<div class="backdrop" data-act="closeSheet"></div><div class="sheet" role="dialog"><div class="in"><div class="grab"></div>${html}</div></div>`;
  sheet=true;
}
function closeSheet(){$('#sheetRoot').innerHTML='';sheet=null;sheetState={};sheetKind=null;}
function opt(act,attrs,on,title,sub,dis){return `<button class="opt ${on?'on':''}" data-act="${act}" ${attrs} ${dis?'disabled':''}><span class="box"></span><span class="ot"><b>${title}</b><span>${sub}</span></span></button>`;}

function waterSheet(){
  const p=curPlant();if(!p)return;
  const s=sheetState;const M=MEDIA[p.medium];
  if(!s.init){
    s.init=true;s.ferts={};s.ph=(S.items.ph||0)>0;
    const f=fp(p);const late=p.stage==='flower'&&f>.8;
    if(!late){
      if((p.stage==='veg'||p.stage==='seed')&&p.nut.n<45&&S.items.grow)s.ferts.grow=true;
      if(p.stage==='flower'&&(p.nut.p<45||p.nut.k<45)&&S.items.bloom)s.ferts.bloom=true;
      if(p.nut.cm<40&&S.items.calmag)s.ferts.calmag=true;
    }
  }
  const ferts=Object.entries(ITEMS).filter(([k,it])=>it.kind==='fert').map(([k,it])=>{
    const n=S.items[k]||0;
    const adds=Object.entries(it.add).map(([a,v])=>`${a==='cm'?'CaMg':a.toUpperCase()}+${v}`).join(' ');
    return opt('wf',`data-k="${k}"`,s.ferts[k],`${esc(it.name)} <span class="mono tiny muted">×${n}</span>`,adds||esc(it.desc),n<=0);
  }).join('');
  const hydro=p.medium==='hydro';
  openSheet(`<h2>${hydro?'Сменить раствор':'Полив'}</h2>
  <div class="small muted">${hydro?'Резервуар заменяется свежей водой. Всё питание — только из того, что добавишь.':`Влага сейчас ${Math.round(p.moist)}%. ${p.moist>72?'<b style="color:var(--bad)">Субстрат ещё мокрый.</b>':''} Чистая вода вымывает ${Math.round(M.leach*100)}% солей.`}</div>
  ${opt('wph','',s.ph,`pH-корректор <span class="mono tiny muted">×${S.items.ph||0}</span>`,`вода 7.4 → ${M.phTarget}. Сейчас в субстрате ${S.eq.phmeter?fmt(p.ph,1):'? (нужен pH-метр)'}`,!(S.items.ph>0))}
  <h3>Удобрения</h3>${ferts}
  <div class="foot"><button class="btn" data-act="closeSheet">Отмена</button><button class="btn primary" data-act="doWater">${hydro?'Залить':'Полить'}${Object.values(s.ferts).some(Boolean)?' с подкормкой':''}</button></div>`);
}
function plantSheet(){
  const s=sheetState;
  const keys=Object.keys(S.seeds).filter(k=>S.seeds[k]>0);
  if(!s.init){s.init=true;s.seed=keys[0]||null;s.med='soil';}
  const seeds=keys.map(k=>{const [id,f]=k.split('|');const st=strainOf(id);return opt('ps',`data-k="${k}"`,s.seed===k,`${esc(st.name)} <span class="mono tiny muted">×${S.seeds[k]}</span>`,`${typeOf(st)} · ${st.auto?'автоцвет':'фотопериод'} · ${f==='f'?'фем.':'регуляр (50% самцов)'}${st.custom?' · твой гибрид':''}`);}).join('')||'<p class="muted small">Семян нет — загляни в магазин.</p>';
  const meds=Object.entries(MEDIA).map(([k,m])=>{const lock=m.lvl>S.level||(m.needs&&!S.eq[m.needs]);return opt('pm',`data-k="${k}"`,s.med===k,`${m.name} · ${m.price} ₵`,lock?(m.lvl>S.level?`уровень ${m.lvl}`:'нужен '+EQUIP[m.needs].name):k==='soil'?'Прощает ошибки, есть запас питания на ~3 недели':k==='coco'?'+12% к росту, пьёт чаще, нужен кальмаг и pH':'+28% к росту, pH уплывает, меняй раствор',lock);}).join('');
  const M=MEDIA[s.med];
  openSheet(`<h2>Посадка · место ${S.sel+1}</h2><h3>Семя</h3>${seeds}<h3>Субстрат · ${esc(POTS[S.eq.pot].name)}</h3>${meds}
  <div class="foot"><button class="btn" data-act="closeSheet">Отмена</button><button class="btn primary" data-act="doPlant" ${s.seed&&S.money>=M.price?'':'disabled'}>Посадить</button></div>`);
}
function trainSheet(){
  const p=curPlant();
  const o=trainOptions(p).map(x=>`<button class="opt" data-act="doTrain" data-k="${x.k}" ${x.ok?'':'disabled'}><span class="ot"><b>${x.name}</b><span>${x.ok?x.desc:x.why}</span></span></button>`).join('');
  openSheet(`<h2>Тренировка</h2><div class="small muted">Тренировки дают урожай, но вызывают стресс. Не тренируй больной куст.${sk('a3')?' Навык «Мастер тренировки» активен.':''}</div>${o}<div class="foot"><button class="btn" data-act="closeSheet">Закрыть</button></div>`);
}
function treatSheet(){
  const p=curPlant();
  const pests=Object.entries(p.pest).filter(([k,v])=>v>(S.eq.loupe?3:8)).map(([k,v])=>`<span class="w ${v>40?'bad':'warn'}">${PESTS[k]} ${Math.round(v)}%</span>`).join('')||'<span class="w good">Вредителей не видно</span>';
  const o=Object.entries(ITEMS).filter(([k,it])=>it.kind==='treat').map(([k,it])=>{const n=S.items[k]||0;return `<button class="opt" data-act="doTreat" data-k="${k}" ${n>0?'':'disabled'}><span class="ot"><b>${esc(it.name)} <span class="mono tiny muted">×${n}</span></b><span>${esc(it.desc)}</span></span></button>`;}).join('');
  openSheet(`<h2>Обработка</h2><div class="warns">${pests}</div>${o}<div class="small muted" style="margin-top:10px">Серую гниль не вылечить — только вырезать поражённые шишки и снизить влажность. Средства — в магазине.</div><div class="foot"><button class="btn" data-act="closeSheet">Закрыть</button></div>`);
}
function trichHtml(p){
  const e=estimate(p);const f=fp(p);
  if(S.eq.loupe){
    const v=x=>sk('c4')?fmt(x*100,1):Math.round(x*10)*10;
    return `<div class="trich" style="height:16px"><i style="width:${e.tr.clear*100}%;background:#dfe8ee"></i><i style="width:${e.tr.milky*100}%;background:#b9b0c4"></i><i style="width:${e.tr.amber*100}%;background:#e0a040"></i></div>
    <div class="small" style="margin-top:8px">Прозрачные ${v(e.tr.clear)}% · мутные ${v(e.tr.milky)}% · янтарные ${v(e.tr.amber)}%</div>`;
  }
  return `<div class="small">Без лупы видно только пестики: ${f<.55?'почти все белые':f<.85?'часть потемнела':f<1.1?'большинство рыжие':'почти все коричневые'}. Точно понять спелость поможет лупа ×60 (30 ₵ в магазине).</div>`;
}
function harvestSheet(){
  const p=curPlant();const e=estimate(p);const f=fp(p);
  const can=f>=.45;
  const status=f<.45?'<span class="w warn">Рано — шишки только набираются</span>':f<.85?'<span class="w warn">Можно, но рановато</span>':f<1.2?'<span class="w good">Окно сбора открыто</span>':'<span class="w bad">Перезревает</span>';
  openSheet(`<h2>Созревание и сбор</h2><div class="warns" style="margin-top:0">${status}</div>
  <h3>Трихомы</h3>${trichHtml(p)}
  <div class="tiny muted" style="margin-top:8px">Прозрачные — рано. Мутные — пик ТГК. 10–30% янтарных — тяжёлый эффект, больше — ТГК распадается.</div>
  <div class="split" style="margin-top:12px"><div class="stat"><div class="k">Сухой вес</div><div class="v">≈ ${fmt(e.g)} г</div></div><div class="stat"><div class="k">Класс до вяления</div><div class="v">${gradeOf(e.q)}</div></div>
  <div class="stat"><div class="k">${e.cbd>5?'CBD':'ТГК'}</div><div class="v">${e.cbd>5?fmt(e.cbd,0):fmt(e.thc,1)}%</div></div><div class="stat"><div class="k">Промывка</div><div class="v" style="font-size:14px">${p.sinceFeed>=7*24?'сделана':p.sinceFeed>=3*24?'частично':'нет'}</div></div></div>
  <div class="small muted" style="margin-top:10px">Эффект: ${esc(e.effect)}. После среза шишки 7 игровых дней сохнут, потом их можно продать или оставить вялиться.${p.pollinated?' Опылённые шишки дадут семена.':''}</div>
  <div class="foot"><button class="btn" data-act="closeSheet">Подождать</button><button class="btn harvest" data-act="doHarvest" ${can?'':'disabled'}>Срезать</button></div>`);
}
function pollSheet(){
  const o=Object.entries(S.pollen).map(([k,n])=>`<button class="opt" data-act="doPoll" data-k="${k}"><span class="ot"><b>Пыльца ${esc(strainOf(k).name)} ×${n}</b><span>${k===curPlant().strain?'Семена того же сорта':'Получится гибрид '+esc(strainOf(curPlant().strain).name)+' × '+esc(strainOf(k).name)}</span></span></button>`).join('');
  openSheet(`<h2>Опыление</h2><div class="small muted">Опылённая самка даст меньше шишек (−45%), но в них созреют семена.</div>${o}<div class="foot"><button class="btn" data-act="closeSheet">Отмена</button></div>`);

function removeAsk(){
  const p=curPlant();

}

/* ---------- EVENTS ---------- */
const ACT={
  tab:d=>{S.ui.tab=d.tab;closeSheet();render();window.scrollTo(0,0);},
  sel:d=>{S.sel=+d.i;renderBox();},
  plantSheet:()=>{sheetState={};plantSheet();},
  ps:d=>{sheetState.seed=d.k;plantSheet();},
  pm:d=>{sheetState.med=d.k;plantSheet();},
  doPlant:()=>{plantSeed(S.sel,sheetState.seed,sheetState.med);closeSheet();after();},
  water:()=>{sheetState={};waterSheet();},
  wf:d=>{sheetState.ferts[d.k]=!sheetState.ferts[d.k];waterSheet();},
  wph:()=>{sheetState.ph=!sheetState.ph;waterSheet();},
  doWater:()=>{const p=curPlant();const f=Object.keys(sheetState.ferts).filter(k=>sheetState.ferts[k]);doWater(p,f,sheetState.ph,false);closeSheet();toast(f.length?'Полито с подкормкой':'Полито');after();},
  info:()=>infoSheet(),
  climate:()=>climateSheet(),
  care:()=>careSheet(),
  trainSheet:()=>trainSheet(),
  doTrain:d=>{train(curPlant(),d.k);closeSheet();toast('Готово');after();},
  treatSheet:()=>treatSheet(),
  doTreat:d=>{treat(curPlant(),d.k);closeSheet();toast('Обработано');after();},
  cutRot:()=>{cutRot(curPlant());closeSheet();after();},
  harvestSheet:()=>harvestSheet(),
  doHarvest:()=>{const j=harvest(S.sel);closeSheet();if(j)toast(`Урожай на сушке: ${fmt(j.g,1)} г`,'good');after();},
  pollSheet:()=>pollSheet(),
  doPoll:d=>{pollinate(curPlant(),d.k);closeSheet();after();},
  pollen:()=>{collectPollen(S.sel);closeSheet();after();},
  removeAsk:()=>removeAsk(),
  remove:()=>{const p=curPlant();if(p)log(`${strainOf(p.strain).name}: растение убрано.`);S.slots[S.sel]=null;closeSheet();after();},
  closeSheet:()=>closeSheet(),
  sched:d=>{const h=+d.h;if(S.sched!==h){S.sched=h;log(`Режим света: ${h}/${24-h}.`);if(h===12)toast('12/12: фотопериодные кусты уходят в цветение');}after();},
  tog:d=>{S.tog[d.k]=!S.tog[d.k];after();},
  shopTab:d=>{S.ui.shopTab=d.k;renderShop();},
  buySeed:d=>{const st=STRAINS[d.id];const pr=seedPrice(st,d.f==='f');if(S.money<pr)return;S.money-=pr;const k=d.id+'|'+d.f;S.seeds[k]=(S.seeds[k]||0)+1;toast(`Куплено: ${st.name}`);after();},
  buyItem:d=>{const it=ITEMS[d.id];if(S.money<it.price)return;S.money-=it.price;S.items[d.id]=(S.items[d.id]||0)+it.pack;toast(`Куплено: ${it.name}`);after();},
  buyTier:d=>{const tb={light:LIGHTS,tent:TENTS,pot:POTS}[d.key];const n=tb[d.id];const pr=eqPrice(n.price);if(S.money<pr)return;S.money-=pr;S.eq[d.key]=d.id;
    if(d.key==='tent'||d.key==='light'){while(S.slots.length<tentSlots())S.slots.push(null);}
    log(`Установлено: ${n.name}.`,'good');toast(`Установлено: ${n.name}`,'good');checkAch();after();},
  buyEq:d=>{const e=EQUIP[d.id];const pr=eqPrice(e.price);if(S.money<pr||S.eq[d.id])return;S.money-=pr;S.eq[d.id]=true;if(['fan','humid','dehumid','ac'].includes(d.id))S.tog[d.id]=d.id==='fan';log(`Установлено: ${e.name}.`,'good');toast(`Установлено: ${e.name}`,'good');after();},
  sell:d=>{sellJar(d.id);after();},
  fulfill:d=>{fulfill(d.o,d.j);after();},
  learn:d=>{const s=SKILLS.find(x=>x.id===d.id);if(S.sp<=0||sk(s.id)>=s.max||(s.req&&!sk(s.req)))return;S.sp--;S.skills[s.id]=sk(s.id)+1;if(s.id==='e4')while(S.slots.length<tentSlots())S.slots.push(null);if(s.id==='t4')refillOrders();log(`Навык: ${s.name}.`,'good');toast(`Изучено: ${s.name}`,'good');after();},
  speed:d=>{catchUp();S.speed=d.id;after();},
  pause:()=>{catchUp();S.paused=!S.paused;S.lastReal=Date.now();after();},
  autoPh:()=>{S.autoPh=!S.autoPh;after();},
  resetAsk:()=>openSheet(`<h2>Начать заново?</h2><div class="small muted">Весь прогресс, деньги и сорта будут удалены.</div><div class="foot"><button class="btn" data-act="closeSheet">Отмена</button><button class="btn danger" data-act="reset">Удалить прогресс</button></div>`),
  reset:()=>{closeSheet();newGame();S.lastReal=Date.now();after();},
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const f=ACT[b.dataset.act];if(f){f(b.dataset,b);}
});
function after(){renderHUD();render();saveLocal();cloudSoon();}

function render(){
  renderHUD();
  const t=S.ui.tab;
  document.body.classList.toggle('boxmode',t==='box');
  if(t==='box')renderBox();else if(t==='shop')renderShop();else if(t==='store')renderStore();else if(t==='skills')renderSkills();else renderLog();
}
function liveUpdate(){
  renderHUD();
  const t=S.ui.tab;
  if(t==='box'){if(dirtyUI||boxSig()!==lastSig)renderBox();else updateBox();}
  else if(t==='shop'){if(shopSig()!==lastSig)renderShop();}
  else if(t==='store'){if(storeSig()!==lastSig)renderStore();}
  else if(t==='log'){const s='log'+S.log.length+(S.log[0]?S.log[0].h:0)+S.speed+S.paused+S.autoPh+Object.keys(S.ach).length;if(s!==lastSig)renderLog();}
  dirtyUI=false;
}

/* ================= TIME & SAVE ================= */
function catchUp(){
  const now=Date.now();const dt=now-S.lastReal;S.lastReal=now;
  if(S.paused||dt<=0)return 0;
  let h=dt/(msPerDay()/24);h=Math.min(h,24*60);
  simulate(h);return h;
}
function saveLocal(){try{S.savedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return null;}
let DBREF=null,cloudT=null,cloudBusy=false;
function cloudSoon(){clearTimeout(cloudT);cloudT=setTimeout(cloudSave,2500);}
async function cloudSave(){
  if(!DBREF||cloudBusy)return;cloudBusy=true;
  try{S.savedAt=Date.now();await DBREF.set({json:JSON.stringify(S),savedAt:S.savedAt});}catch(e){}
  cloudBusy=false;
}
async function initCloud(){
  try{
    for(let i=0;i<50&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));
    if(!(window.claude&&window.claude.use))return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    DBREF=db.doc('data/users/'+id+'/save');
    const snap=await DBREF.get();
    if(snap.exists){
      const d=snap.data();
      if(d&&d.json&&d.savedAt>(S.savedAt||0)+5000){
        const s2=JSON.parse(d.json);S=migrate(s2);const h=catchUp();render();
        toast('Прогресс загружен из облака');if(h>=6)awaySummary(h,[]);
      }
    }
    cloudSave();
  }catch(e){}
}
function awaySummary(h,before){
  const days=h/24;
  const fresh=S.log.filter(e=>!before.includes(e)).slice(0,12);
  openSheet(`<h2>Пока тебя не было</h2><div class="small muted">Прошло ${fmt(days,days<2?1:0)} игр. дн.</div>
  <div class="log" style="margin-top:8px">${fresh.map(e=>`<div class="le ${e.k}"><span class="t">д${Math.floor(e.h/24)+1}</span><span class="x">${esc(e.t)}</span></div>`).join('')||'<div class="small muted" style="padding:8px 0">Ничего особенного не произошло.</div>'}</div>
  <div class="foot"><button class="btn primary" data-act="closeSheet">К боксу</button></div>`);
}

/* ================= BOOT ================= */
(function boot(){
  const saved=loadLocal();
  if(saved){S=migrate(saved);}else{newGame();}
  const before=S.log.slice();
  const h=catchUp();
  render();
  if(h>=6)awaySummary(h,before);
  setInterval(()=>{if(document.hidden)return;catchUp();liveUpdate();},1000);
  setInterval(saveLocal,5000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){saveLocal();cloudSave();}else{const b=S.log.slice();const h=catchUp();render();if(h>=6&&!sheet)awaySummary(h,b);}});
  window.addEventListener('pagehide',()=>{saveLocal();cloudSave();});
  window.addEventListener('resize',()=>{if(S.ui.tab==='box'){sizeStage();updateBox();}});
  initCloud();
})();

/* ================= TELEGRAM MINI APP ================= */
// Функции ниже переопределяют одноимённые выше (последнее объявление побеждает).
function tgApp(){
  const T=window.Telegram&&window.Telegram.WebApp;
  return T&&T.initData?T:null; // initData пустой вне Telegram
}
function tgEsc(s){return s.replace(/[\u0080-￿]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'));}
async function initCloud(){
  const T=tgApp();if(!T)return;
  try{
    T.ready();T.expand();
    if(T.isVersionAtLeast('7.7'))T.disableVerticalSwipes();
    if(T.isVersionAtLeast('6.1')){T.setHeaderColor('#141017');T.setBackgroundColor('#141017');}
    if(T.isVersionAtLeast('7.10'))T.setBottomBarColor('#141017');
    T.onEvent('viewportChanged',()=>{if(S.ui.tab==='box'){sizeStage();updateBox();}});
    if(T.isVersionAtLeast('6.1'))T.BackButton.onClick(()=>closeSheet());
    if(T.isVersionAtLeast('8.0'))T.onEvent('deactivated',()=>{saveLocal();cloudSave();});
  }catch(e){}
  if(!T.isVersionAtLeast('6.9')){tgCloudOK=false;return;}
  try{
    const cs=T.CloudStorage;
    const meta=await new Promise(r=>cs.getItem('gr_meta',(e,v)=>r(e?null:v)));
    if(meta){
      const m=JSON.parse(meta);
      const keys=Array.from({length:m.n},(_,i)=>'gr_'+i);
      const vals=await new Promise(r=>cs.getItems(keys,(e,v)=>r(e?null:v)));
      if(vals&&m.savedAt>(S.savedAt||0)+5000){
        const json=keys.map(k=>vals[k]||'').join('');
        const before=S.log.slice();
        S=migrate(JSON.parse(json));const h=catchUp();render();
        toast('Прогресс загружен из Telegram','good');
        if(h>=6)awaySummary(h,before);
      }
    }
    tgCloudOK=true;cloudSave();
  }catch(e){tgCloudOK=true;}
}
async function cloudSave(){
  const T=tgApp();if(!T||!tgCloudOK||tgBusy)return;tgBusy=true;
  try{
    S.savedAt=Date.now();
    const json=tgEsc(JSON.stringify(S));
    const parts=[];for(let i=0;i<json.length;i+=4000)parts.push(json.slice(i,i+4000));
    const cs=T.CloudStorage;
    const set=(k,v)=>new Promise(r=>cs.setItem(k,v,()=>r()));
    for(let i=0;i<parts.length;i++)await set('gr_'+i,parts[i]);
    await set('gr_meta',JSON.stringify({n:parts.length,savedAt:S.savedAt}));
  }catch(e){}
  tgBusy=false;
}
function openSheet(html,kind){
  sheetKind=kind||null;
  $('#sheetRoot').innerHTML=`<div class="backdrop" data-act="closeSheet"></div><div class="sheet" role="dialog"><div class="in"><div class="grab"></div>${html}</div></div>`;
  sheet=true;
  const T=tgApp();if(T&&T.isVersionAtLeast('6.1'))T.BackButton.show();
}
function closeSheet(){
  $('#sheetRoot').innerHTML='';sheet=null;sheetState={};sheetKind=null;
  const T=tgApp();if(T&&T.isVersionAtLeast('6.1'))T.BackButton.hide();
}
var tgCloudOK=false,tgBusy=false;
// вибрация
(function(){
  const T=tgApp();if(!T||!T.HapticFeedback||!T.isVersionAtLeast('6.1'))return;
  const H=T.HapticFeedback;
  const wrap=(k,fn)=>{const o=ACT[k];if(!o)return;ACT[k]=(d,b)=>{try{fn();}catch(e){}return o(d,b);};};
  wrap('doWater',()=>H.impactOccurred('medium'));
  wrap('doHarvest',()=>H.notificationOccurred('success'));
  wrap('tab',()=>H.selectionChanged());
  wrap('sel',()=>H.selectionChanged());
  ['buySeed','buyItem','buyTier','buyEq','sell','fulfill','learn','doTrain','doTreat','doPlant','pollen','doPoll'].forEach(k=>wrap(k,()=>H.impactOccurred('light')));
})();
